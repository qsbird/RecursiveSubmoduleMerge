<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="Minimal side-view upside-down dung beetle icon">
  <rect width="1024" height="1024" fill="#F7F3EA"/>

  <!-- Cropped dung ball: intentionally only a partial crescent/half is visible. -->
  <circle cx="900" cy="250" r="330" fill="#111111"/>

  <!-- Inverted side-view beetle, hanging below the ball and pushing upward. -->
  <g fill="#111111" stroke="#111111" stroke-width="52" stroke-linecap="round" stroke-linejoin="round">
    <!-- Legs reaching upward to make the inverted pose readable at icon sizes. -->
    <path d="M650 515 L710 430 L790 392"/>
    <path d="M600 552 L642 455 L708 410"/>
    <path d="M510 600 L545 495 L610 450"/>
    <path d="M438 635 L410 525 L455 455"/>
    <path d="M362 676 L300 575 L315 505"/>
    <path d="M285 710 L205 645 L180 565"/>

    <!-- Small claw ticks where legs press into the ball/air. -->
    <path d="M790 392 L822 365"/>
    <path d="M708 410 L742 386"/>
    <path d="M610 450 L644 428"/>
    <path d="M455 455 L494 445"/>
    <path d="M315 505 L350 490"/>
    <path d="M180 565 L204 532"/>
  </g>

  <g fill="#111111">
    <!-- Body is below the legs: abdomen, thorax, and head in a pure side silhouette. -->
    <ellipse cx="360" cy="720" rx="210" ry="125" transform="rotate(-13 360 720)"/>
    <ellipse cx="555" cy="635" rx="150" ry="105" transform="rotate(-16 555 635)"/>
    <ellipse cx="695" cy="545" rx="80" ry="68" transform="rotate(-18 695 545)"/>
  </g>

  <!-- Two-color negative-space cuts for shell segmentation and clearer beetle identity. -->
  <g fill="none" stroke="#F7F3EA" stroke-width="34" stroke-linecap="round">
    <path d="M230 735 C310 675 400 622 510 588"/>
    <path d="M440 610 C510 645 555 690 594 750"/>
    <path d="M650 505 C678 518 705 530 734 540"/>
  </g>
</svg>
